[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-a04-mcp-enterprise-integration"
version = "0.1.0"
description = "Enterprise AI integration architecture using MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
